services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: cemetery_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-cemetery_gis3d}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-cemetery_gis3d}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
